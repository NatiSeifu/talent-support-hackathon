scenario_id: scenario_01_auth_refresh
dataset_layer: expected_outputs
visibility: evaluator_only

allowed_resolution_states:
  - supported
  - supported_with_limitations
  - supported_after_interview_validation
  - partially_supported
  - contested
  - contradicted
  - unresolved
  - abstained

claim_resolutions:
  - claim_id: claim_sarah_impl_experience
    expected_resolution: supported
    required_evidence_dimensions:
      - recorded_implementation_activity
      - substantive_review_or_change_context
    sufficient_source_families:
      - software_development
    must_not_infer:
      - full_operational_capability_from_code_activity_alone

  - claim_id: claim_sarah_operational_capability
    expected_resolution: supported_after_interview_validation
    required_evidence_dimensions:
      - incident_participation
      - decisive_diagnostic_or_mitigation_context
      - knowledge_validation_answer
    sufficient_source_families:
      - production_operations
      - knowledge_validation
    must_not_infer:
      - operational_capability_from_incident_presence_alone

  - claim_id: claim_docs_insufficient
    expected_resolution: supported
    required_evidence_dimensions:
      - stale_or_incomplete_artifact
      - validation_failure_or_gap
    sufficient_source_families:
      - knowledge_artifacts
      - knowledge_validation
    must_not_infer:
      - transferability_from_document_existence

  - claim_id: claim_alex_formal_not_capable
    expected_resolution: supported
    required_evidence_dimensions:
      - formal_ownership_reference
      - absence_of_demonstrated_capability
      - validation_or_context_showing_no_direct_capability
    sufficient_source_families:
      - ownership_and_architecture
      - knowledge_validation
    must_not_infer:
      - expertise_from_codeowners_or_manager_role

  - claim_id: claim_mike_partial
    expected_resolution: partially_supported
    required_evidence_dimensions:
      - review_or_conceptual_exposure
      - failed_or_incomplete_validation_for_redis_failover
    sufficient_source_families:
      - software_development
      - knowledge_validation
    must_not_infer:
      - independent_redis_failover_capability

  - claim_id: claim_priya_partial
    expected_resolution: partially_supported
    required_evidence_dimensions:
      - incident_mitigation_participation
      - rollback_or_monitoring_activity
      - missing_undocumented_bypass_in_validation
    sufficient_source_families:
      - production_operations
      - knowledge_validation
    must_not_infer:
      - decisive_diagnosis_or_full_resolution

  - claim_id: claim_knowledge_loss_concern
    expected_resolution: supported_with_limitations
    required_evidence_dimensions:
      - business_importance
      - departure_exposure
      - knowledge_concentration
      - incomplete_transferability
      - partial_successor_coverage
    sufficient_source_families:
      - identity_and_organization
      - business_impact
      - production_operations
      - knowledge_artifacts
      - knowledge_validation
    limitations:
      - exact_bus_factor_unknown
      - no_numeric_risk_score
      - partial_coverage_exists

  - claim_id: claim_jordan_gap_coverage
    expected_resolution: supported
    required_evidence_dimensions:
      - candidate_adjacent_general_experience
      - missing_company_specific_validation
    sufficient_source_families:
      - candidate_and_successor_evidence
      - knowledge_validation
    must_not_infer:
      - candidate_readiness
      - global_candidate_ranking
