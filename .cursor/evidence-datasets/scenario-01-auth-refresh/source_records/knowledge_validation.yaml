    participant_person_id: person_sarah_chen
    question_id: q_redis_order
    question: During AUTH-219, why did you bypass Redis token validation before rolling back the auth deployment?
    answer_summary: >
      Sarah explains that stale token-cache entries caused refresh checks to
      reject otherwise valid sessions. Bypassing Redis token validation first
      prevented the rollback from repeatedly reading poisoned cache state.
    corroborating_source_record_ids:
      - incident_auth_219
      - slack_incident_auth_219_sarah_context
      - doc_auth_runbook
    linked_capability_ids:
      - cap_redis_failover_proc
      - cap_auth_incident_diag
    supports:
      - Sarah holds an undocumented Redis bypass ordering rationale.
    cannot_establish:
      - The procedure is now durably transferred.

